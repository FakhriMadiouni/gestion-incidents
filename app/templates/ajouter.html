{% extends "base.html" %}
{% block content %}
<h2>Signaler un incident</h2>
{% if erreur %}<p class="erreur">{{ erreur }}</p>{% endif %}
<form method="post">
  <label for="titre">Titre</label>
  <input id="titre" name="titre" required>
  <label for="description">Description</label>
  <textarea id="description" name="description" rows="4" required></textarea>
  <label for="lieu">Lieu (salle ou laboratoire)</label>
  <input id="lieu" name="lieu" required>
  <label for="priorite">Priorité</label>
  <select id="priorite" name="priorite">
    {% for p in priorites %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
  </select>
  <button type="submit">Enregistrer</button>
</form>
{% endblock %}
